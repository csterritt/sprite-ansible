---
- name: Set up delphi-1 apps
  hosts: delphi-1
  become: true
  # become_user: ubuntu
  vars:
    brew_packages:
      - bun
      - eza
      - gcc
      - git
      - jj
      - lsof
      - ripgrep
      - sqlite
      - sqlite-utils
      - wget
      - cloudflared
    lbb_source_files:
      - .env
      - .env.template
      - .gitignore
      - .oxfmtrc.json
      - bun.lock
      - e2e-tests/
      - leaderboard.db
      - LICENSE.txt
      - Notes/
      - Notes.md
      - package.json
      - README.md
      - src/
      - tests/
      - tsconfig.json
      - vitest.config.ts

  tasks:
    - name: Copy bash_aliases file for ubuntu with owner and permissions
      ansible.builtin.copy:
        src: ./bash_aliases
        dest: /home/ubuntu/.bash_aliases
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      tags:
      - files

    - name: Install notify-app
      ansible.builtin.copy:
        src: /Users/chris/hacks/notifier/notify-app/tmp/amd/notify-app
        dest: /home/ubuntu/notify-app
        owner: ubuntu
        group: ubuntu
        mode: '0700'
      tags:
      - apps

    - name: Install chz
      ansible.builtin.copy:
        src: /Users/chris/hacks/chz/tmp/amd/chz
        dest: /home/ubuntu/chz
        owner: ubuntu
        group: ubuntu
        mode: '0700'
      tags:
      - apps

    - name: Install tar-new.sh
      ansible.builtin.copy:
        src: /Users/chris/hacks/run-books/tar-new.sh
        dest: /home/ubuntu/tar-new.sh
        owner: ubuntu
        group: ubuntu
        mode: '0700'
      tags:
      - apps

    - name: Tap bun homebrew tap
      ansible.builtin.shell:
        cmd: |
          /home/linuxbrew/.linuxbrew/bin/brew tap oven-sh/bun
      args:
        creates: /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/oven-sh/homebrew-bun
      tags:
      - apps

    - name: Ensure .bashrc sets up homebrew paths
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"'
      tags:
      - files

    - name: Ensure .bashrc sources .bash_aliases
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'source ~/.bash_aliases'
      tags:
      - files

    - name: Install Homebrew packages
      community.general.homebrew:
        name: "{{ brew_packages }}"
        state: present

    - name: Copy lbb source files
      ansible.builtin.copy:
        src: /Users/chris/hacks/discord-bot/leaderboard-bot/{{ item }}
        dest: /home/ubuntu/leaderboard-bot/{{ item }}
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      loop: "{{ lbb_source_files }}"
      tags:
      - files

    - name: Copy dot_env file for scripts
      ansible.builtin.copy:
        src: ./dot_env
        dest: /home/ubuntu/scripts/.env
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      tags:
      - files
      - scripts

    - name: Copy cloudflared tunnel start script with owner and permissions
      ansible.builtin.copy:
        src: ./start-cloudflare-tunnel.sh
        dest: /home/ubuntu/scripts/start-cloudflare-tunnel.sh
        owner: ubuntu
        group: ubuntu
        mode: '0700'
      tags:
      - files
      - scripts

    - name: Copy leaderboard-bot start script with owner and permissions
      ansible.builtin.copy:
        src: ./start-leaderboard-bot.sh
        dest: /home/ubuntu/scripts/start-leaderboard-bot.sh
        owner: ubuntu
        group: ubuntu
        mode: '0700'
      tags:
      - files
      - scripts

    - name: Copy cloudflare-tunnel systemd service file
      ansible.builtin.copy:
        src: ./cloudflare-tunnel-systemd.service
        dest: /etc/systemd/system/cloudflare-tunnel.service
        owner: root
        group: root
        mode: '0644'
      tags:
      - files
      - scripts

    - name: Enable and start cloudflare-tunnel service
      ansible.builtin.systemd_service:
        name: cloudflare-tunnel
        enabled: true
        state: started
      tags:
      - services

    - name: Copy leaderboard-bot systemd service file
      ansible.builtin.copy:
        src: ./leaderboard-bot-systemd.service
        dest: /etc/systemd/system/leaderboard-bot.service
        owner: root
        group: root
        mode: '0644'
      tags:
      - files
      - scripts

    - name: Enable and start leaderboard-bot service
      ansible.builtin.systemd_service:
        name: leaderboard-bot
        enabled: true
        state: started
      tags:
      - services
