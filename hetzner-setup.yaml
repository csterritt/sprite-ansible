    - name: Install atuin
      command: sudo snap install atuin
      tags:
      - apps

    - name: Install nvm
      command: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      tags:
      - apps

    - name: Install node 22
      command: source "$HOME/.nvm/nvm.sh" && nvm install 22
      tags:
      - apps

    # - name: Install tirith
    #   ansible.builtin.shell: /.chris/bin/npm install -g tirith
    #   tags:
    #   - apps

    - name: Install mailpit
      ansible.builtin.shell: curl -sL https://raw.githubusercontent.com/axllent/mailpit/develop/install.sh> /tmp/mailpit_install.sh && sudo sh < /tmp/mailpit_install.sh && rm -f /tmp/mailpit_install.sh
      tags:
      - apps

    - name: Install notify-app
      ansible.builtin.copy:
        src: /Users/chris/hacks/notifier/notify-app/tmp/notify-app
        dest: /home/chris/notify-app
        owner: chris
        group: chris
        mode: '0700'
      tags:
      - apps

    - name: Copy .zshrc file for chris with owner and permissions
      ansible.builtin.copy:
        src: ./basic_dot_zshrc
        dest: /home/chris/.zshrc
        owner: chris
        group: chris
        mode: '0600'
      tags:
      - files

    - name: Copy .zshrc file for helper with owner and permissions
      ansible.builtin.copy:
        src: ./basic_dot_zshrc
        dest: /home/helper/.zshrc
        owner: helper
        group: helper
        mode: '0600'
      tags:
      - files

