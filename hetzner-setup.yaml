---
- hosts: new-hetzner
  become: true

  handlers:
    # Note: Use 'sshd' for Red Hat and its derivatives.
    - name: restart ssh
      service: name=ssh state=restarted
      tags:
      - first

  tasks:
    - name: Update SSH configuration to be more secure.
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: 'sshd -t -f %s'
      with_items:
        - regexp: "^PasswordAuthentication"
          line: "PasswordAuthentication no"
        - regexp: "^PubkeyAuthentication"
          line: "PubkeyAuthentication yes"
        # - regexp: "^PermitRootLogin"
        #   line: "PermitRootLogin no"
        # - regexp: "^Port"
        #   line: "Port 2849"
      notify: restart ssh
      tags:
      - first

    # - name: Allow sshd to listen on tcp port 2849.
    #   seport:
    #     ports: 2849
    #     proto: tcp
    #     setype: ssh_port_t
    #     state: present
    # FIXME: this is not the new way to do conditionals
    #   when: ansible_selinux.status == 'enabled'
    #   tags:
    #   - first

    - name: Update and upgrade all apt packages
      command: sudo apt update && sudo apt upgrade -y
      tags:
      - first

    - name: Install zsh
      apt:
        name: zsh
        state: latest
      tags:
      - first

    - name: Install various utilities
      command: apt install -y git curl wget apt-transport-https ca-certificates locales vim
      tags:
      - first

    # User account configuration.
    - name: Add a sudo-capable user.
      user:
        name: chris
        state: present
        shell: /usr/bin/zsh
      tags:
      - first

    - name: Add sudo rights for chris.
      lineinfile:
        dest: /etc/sudoers
        regexp: '^chris'
        line: 'chris ALL=(ALL) NOPASSWD: ALL'
        state: present
        validate: 'visudo -cf %s'
      tags:
      - first

    - name: Make chris's public ssh key directory
      command: mkdir -p /home/chris/.ssh
      tags:
      - first

    - name: Install chris's public ssh key
      ansible.builtin.copy:
        src: /Users/chris/.ssh/id_ed25519_chris_hetz.pub
        dest: /home/chris/.ssh/authorized_keys
        owner: chris
        group: chris
        mode: '0600'
      tags:
      - first

    - name: Add a least-privilege user.
      user:
        name: helper
        state: present
        shell: /usr/bin/zsh
      tags:
      - first

    - name: Make helper's public ssh key directory
      command: mkdir -p /home/helper/.ssh
      tags:
      - first

    - name: Install helper's public ssh key
      ansible.builtin.copy:
        src: /Users/chris/.ssh/id_ed25519_helper_hetz.pub
        dest: /home/helper/.ssh/authorized_keys
        owner: helper
        group: helper
        mode: '0600'
      tags:
      - first

    - name: Remove unused packages.
      package:
        name:
          - nano
          - sendmail
        state: absent
        purge: yes
      tags:
      - first

