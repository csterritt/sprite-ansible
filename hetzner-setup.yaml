        owner: chris
        group: chris
        mode: '0600'
      tags:
      - files

    - name: Copy bash_aliases file for helper with owner and permissions
      ansible.builtin.copy:
        src: ./bash_aliases
        dest: /home/helper/.bash_aliases
        owner: helper
        group: helper
        mode: '0600'
      tags:
      - files

