---
- name: Set up base-w-ts sprite
  hosts: base-w-ts
  become: true
  tasks:
    - name: Upgrade all apt packages
      apt:
        force_apt_get: yes
        upgrade: dist
      become: yes
    - name: Install lsof
      apt:
        name: lsof
        state: latest
    - name: Install eza
      apt:
        name: eza
        state: latest
    - name: bash_aliases
      ansible.builtin.lineinfile:
        path: /home/sprite/.zshrc
        line: 'source ~/.bash_aliases'
